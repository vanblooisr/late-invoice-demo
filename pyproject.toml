[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "late-invoice-demo"
dynamic = ["version"]
description = "Late invoice in Moneybird -> Telegram approve -> Mollie payment link -> paid in Moneybird. A demo on sandbox data, built in public."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.27",
  "python-telegram-bot>=21",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
lid = "late_invoice_demo.cli:main"

[project.urls]
Repository = "https://github.com/vanblooisr/late-invoice-demo"

[tool.setuptools]
package-dir = { "" = "core" }

[tool.setuptools.dynamic]
version = { attr = "late_invoice_demo.__version__" }

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
late_invoice_demo = ["adapters/sample_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]
