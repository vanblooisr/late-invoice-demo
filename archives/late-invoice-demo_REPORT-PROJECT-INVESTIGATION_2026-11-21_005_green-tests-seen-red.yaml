    - {id: P2, broke: "Fake adapter's get_contact takes no contact id", nearest: "test_is_a_bookkeeping_port[fake]", stayed_green_because: "isinstance against a runtime_checkable Protocol compares names, not signatures"}
    - {id: P3, broke: "amount pattern accepts three decimals", nearest: test_amount_pattern_constant, stayed_green_because: "the test's only rejected example is one decimal"}
    - {id: P4, broke: "amount pattern accepts a minus sign", nearest: test_amount_pattern_constant, stayed_green_because: "no negative example in the test"}
    - {id: P5, broke: "Mollie client refuses only live_ keys, accepts any other prefix", nearest: test_live_key_is_refused, stayed_green_because: "the test's only refused example starts with live_"}
