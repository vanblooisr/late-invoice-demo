# REPORT: late-invoice-demo — the 30 green tests of the zero point, each seen red once
# Session 005, 2026-11-21. Purpose: the zero point lists 30 tests that passed before any stage body
# existed. A test that never failed has only been inspected. This report records one deliberate break
# per declared contract, which test noticed it, and a second round of breaks that no test noticed.
# Findings, not conclusions: which survivors become new tests is the operator's call.

frame:
  project: late-invoice-demo
  nnn: 005
  date: "2026-11-21"
  mode: centrifugal (CONTRACT_annie_v2), bookkeeping session
  question: "Do the 30 green tests of the zero point fail when the contract they pin is broken, and what do they not pin?"
  ruling: "D-{005}.16 — OT-011 item 7, option C: keep the 30 green, prove each once by breaking its contract"
  boundary: |
    Run on: a copy of repo/ in the session scratch folder; the repo itself was never written.
    Interpreter: Python 3.14.6, pytest from the session-004 environment (the only one with the pinned
    dependencies installed), with the copy's core/ on the import path.
    Baseline on the copy before any break: 234 collected · 134 failed · 70 errored · 30 passed — the same
    totals as archives/zero-point_test-baseline.md.
    Covered: the 30 passing tests only. NOT covered: the 204 red tests. A red test cannot be shown to
    notice a break while the body it tests does not exist; that check becomes possible stage by stage,
    as each slice turns green.
    The breaks are hand-chosen, one or more per contract. They are not an exhaustive mutation run; a
    contract can have breaks nobody thought of.

method:
  steps:
    - "Copy repo/ to scratch. Run the suite. Record the 30 passing test ids."
    - "For each break: change one line in the copy, run the 30, record which fail, restore the line."
    - "After the last break: run the 30 again on the restored copy (30 passed, both rounds)."
  round_1: "31 breaks, each aimed at the contract one of the 30 tests names."
  round_2: "7 breaks aimed at what the same tests leave unsaid — a neighbouring wrong value, a wrong signature, a wrong default."
  scripts: "break_contracts.py and break_contracts_round2.py in the session scratch folder; not in the repo."

findings:
  - id: F-{005}.01
    what: "All 30 green tests have now failed at least once. Each of the 31 round-1 breaks was noticed by the test that names its contract; none survived."
    how: "Round 1 run: 31 of 31 CAUGHT, 'never seen red' list empty."
    why: "Closes the gap the 'every test red' rule exists for, for these 30: they are verified to be able to fail, not only inspected."
    evidence_strength: confirmed
  - id: F-{005}.02
    what: "All 7 round-2 breaks survived: the 30 tests stayed green with the contract broken."
    how: "Round 2 run: 7 of 7 SURVIVED."
    why: "Each survivor is a place where a wrong implementation would pass today's green tests. Whether a still-red test covers it later is not measured (see gaps)."
    evidence_strength: confirmed
  - id: F-{005}.03
    what: "Two survivors touch the safety rules the README states: a Settings repr that prints the Mollie key (the test checks one field, the Moneybird token), and a Mollie client that accepts any key not starting with live_ (the test checks one live_ key)."
    how: "Round 2, P1 and P5."
    why: "Rule 1 (no secret printed) and the test-keys-only rule are each pinned by a single example, not by the rule."
    evidence_strength: confirmed
  - id: F-{005}.04
    what: "One survivor contradicts a README line: with fetch's default adapter changed from fake to moneybird, every green test still passes. The README says 'lid fetch' uses the fake adapter and needs no keys."
    how: "Round 2, P7."
    why: "The default is what a first run does; no green test names it."
    evidence_strength: confirmed
  - id: F-{005}.05
    what: "The port check sees names, not signatures: the Fake adapter with get_contact() taking no contact id still counts as a BookkeepingPort."
    how: "Round 2, P2. The test is isinstance against a runtime_checkable Protocol, which compares attribute names only."
    why: "The port's docstring says the Protocol lists get_contact 'so the signature is fixed'; the green test does not fix it. The red contract tests call the verbs and may catch it once the bodies exist — not measured."
    evidence_strength: confirmed

