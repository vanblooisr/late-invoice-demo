    - {id: P7, broke: "fetch defaults to the moneybird adapter", nearest: "test_help_lists_adapter_flag[fetch]", stayed_green_because: "no green test names the default"}

round_3:
  note: |
    Run after the operator agreed the upgrade candidates. The candidates were written as six tests, closing the seven surviving breaks,
    (31 cases across five existing test files) and the suite re-run: 265 collected · 134 failed ·
    70 errored · 61 passed. Then 26 breaks: the six round-2 survivors that still apply (P1, P3-P7; P2 is
    covered by the fake get_contact break below) plus one break per new case that the survivors do not reach.
  result: "26 of 26 noticed by a new test. All 31 new cases failed at least once. After the round the 61 green tests passed again on the restored copy."
  false_result_caught: |
    The first run of this round reported every break as 'noticed by 61 tests' and 0 tests restored.
    That was the runner, not the tests: the new test ids contain spaces and empty brackets, pytest could
    not select them from the command line, and the runner read 'no result' as 'failed'. The round was
    re-run with the whole suite on every break and results matched by id. Rounds 1 and 2 selected 30 ids
    without such characters and ended with 30 of 30 restored, so they are not affected.
  new_tests:
    - {file: test_config.py, test: test_settings_repr_and_str_hide_every_value, cases: 1, closes: P1}
    - {file: test_port_contract.py, test: test_verb_parameters_match_the_port, cases: 8, closes: P2}
    - {file: test_money.py, test: test_amount_pattern_rejects, cases: 9, closes: "P3, P4"}
    - {file: test_mollie_client.py, test: test_any_key_without_the_test_prefix_is_refused, cases: 5, closes: P5}
    - {file: test_cli.py, test: test_unknown_adapter_is_usage_error, cases: 4, closes: P6}
    - {file: test_cli.py, test: test_adapter_defaults_to_fake, cases: 4, closes: P7}
  scripts: "add_upgrade_tests.py and break_contracts_round3.py in the session scratch folder; not in the repo."

round_4:
  note: |
    Run after a 17-cell code review of the session's diff (review envelope CODE-REVIEWED 005). The review
    found that the upgrade tests pinned the break each was written for and left the next-nearest break
    open. Three tests were tightened and the suite re-run: 269 collected · 134 failed · 70 errored · 65 passed.
  tightened:
    - {test: test_settings_repr_and_str_hide_every_value, change: "every field of Settings is set from the dataclass's own field list, and repr and str are compared with the exact names-only form", closes: "review CR-002, CR-005"}
    - {test: test_any_key_without_the_test_prefix_is_refused, change: "four boundary keys added: the bare word, the word without the underscore, the prefix later in the key, the prefix after a space (9 cases)", closes: "review CR-003"}
    - {test: test_verb_parameters_match_the_port, change: "compares each parameter's name, order, kind and whether it has a default; annotations are not compared", closes: "review CR-004"}
  breaks:
    - {id: R1, broke: "Settings repr shows db_path", noticed_by: test_settings_repr_and_str_hide_every_value}
    - {id: R2, broke: "Settings repr shows the last four characters of each value", noticed_by: "test_settings_repr_and_str_hide_every_value · test_settings_repr_and_str_hide_values"}
    - {id: R3, broke: "Mollie guard checks for the word without the underscore", noticed_by: test_any_key_without_the_test_prefix_is_refused}
    - {id: R4, broke: "Mollie guard checks that the prefix occurs anywhere", noticed_by: test_any_key_without_the_test_prefix_is_refused}
    - {id: R5, broke: "Mollie guard strips the key before checking", noticed_by: test_any_key_without_the_test_prefix_is_refused}
    - {id: R6, broke: "fake adapter: get_invoice parameter made keyword-only", noticed_by: test_verb_parameters_match_the_port}
    - {id: R7, broke: "moneybird adapter: get_contact gains a default", noticed_by: test_verb_parameters_match_the_port}
    - {id: R8, broke: "fake adapter: register_payment's last parameter gains a default", noticed_by: test_verb_parameters_match_the_port}
  result: "8 of 8 noticed. After the round the 65 green tests passed again on the restored copy."
  not_done: "Review findings left as they are: CR-006 (no non-ASCII digit case in the amount test), CR-007 (the verb list is typed by hand), CR-008 (a comment in the cli test claims more than the test checks), CR-009 (the lock's interpreter note). CR-001 (no rule left for the income phrases) awaits an operator ruling."
  scripts: "tighten_tests.py and break_contracts_round4.py in the session scratch folder; not in the repo."

upgrade_candidates:
  note: "One candidate per survivor: the test that would have noticed it. All seven are now written (round_3)."
  rows:
    - {for: P1, candidate: "set every secret field of Settings to a marker and assert none appears in repr or str"}
    - {for: P2, candidate: "compare each adapter's verb signatures with the Protocol's (inspect.signature), not only the names"}
    - {for: "P3, P4", candidate: "add rejected examples to the amount pattern test: three decimals, a minus sign, an empty string"}
    - {for: P5, candidate: "parametrize the refused keys: live_, an unknown prefix, an empty string"}
    - {for: P6, candidate: "assert an unknown --adapter value is a usage error on each stage that has the flag"}
    - {for: P7, candidate: "assert the parsed default of --adapter is the fake adapter on each stage that has the flag"}

gaps:
  - "The 204 red tests are untested as tests. Whether a wrong implementation would pass them was reviewed by reading in session 004 (the 26-cell review); it has not been run, and cannot be until the bodies exist."
  - "Whether a still-red test already covers a round-2 survivor is not measured. Names that suggest overlap: test_non_test_mollie_key_refused_from_file / _from_process_env (config, near P5), test_three_decimal_amount_fails_closed (Mollie client, near P3). Inferred from the names only; the bodies were not read for this."
  - "The breaks were chosen by the same model that wrote this report. A second chooser would pick others."
  - "The run used the session-004 environment's interpreter with this worktree's code on the path; no fresh install from requirements.lock was made."

open_threads:
  - id: OT-011
    note: "Item 7 is ruled option C and carried out here for the 30 green tests and the 31 new cases. Ruled (D-{005}.18): the same break-and-watch step runs on each slice as it turns green; the build ends with every test green. The zero-point file in the repo's archives still records the 234-test run and is not edited; the suite is now 269 (round_4)."

verification:
  restored: "After each round the 30 tests passed again on the restored copy (30 of 30, both rounds)."
  repo_untouched: "git status after the runs shows no modified file under repo/core/; the only entries are the placeholder files the operator deleted this session."
  not_verified: "The report was not read by a second instance."
