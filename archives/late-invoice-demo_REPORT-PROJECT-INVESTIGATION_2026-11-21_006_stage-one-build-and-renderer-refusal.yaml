round_two:
  what_ran:
    - "Two static reviews (opus): the common-module fixes; the adapter and fetch fixes together with the projector and tree-check changes."
    - "One break-and-watch run (sonnet agent, scratch copy) aimed at what the fix passes added."
    - "Two fix builders in parallel on disjoint files, then one small correction builder (sonnet)."
    - "The projector was fixed in the main thread."
  suite_after: "906 collected · 782 passed · 124 failed, three runs identical (main thread). The 124 are in the same five modules as before; a --tb=line run showed no failure with another cause. Tree check clean on 54 files; --check-only on the public plan copy: 0 banned hits, 0 structure problems."
  findings:
    - id: "F-{006}.014"
      what: "The projector dropped governance keys only at the top level of a document. A decision_ledger nested inside another section would have reached the public copy with its quoted words, unless a word happened to match the banned list."
      how: "Static review; then reproduced in the main thread with a plan copy carrying a nested ledger and invented quoted words."
      why: "The old positional code had the same gap; the session's rewrite kept it. Fixed in the main thread: the keys are dropped at any depth; a source that uses a YAML anchor or alias is refused (an alias could carry governance content into a public section); a document that is not a mapping is refused; the 'first three documents' rule is removed; --check-only now runs the value scan and a structure check. Each was checked by running it, and the real plan still produced a file identical to the public copy in the repo. These main-thread changes have had no second reader."
      evidence_strength: confirmed
    - id: "F-{006}.015"
      what: "Break-and-watch on the fix passes: 153 breaks applied, 138 caught, 15 survived, of which the agent judged 7 unable to change behaviour — 8 real survivors. In the first stage-1 run it was 73 caught of 115."
      how: "One sonnet agent on a scratch copy; whole suite per break; repo status checksum identical before and after. Not re-run."
      why: "The 8: a KeyboardInterrupt mid-write; list_rows with an unknown status; require() with an unknown field; camelCase secret names; a short bearer token holding a digit; a non-transport HTTP error on the booking call; a 401 message that could carry request headers; fetch_late returning invoices for a refused batch. Each is now a test. Several were green when written: the code already kept the rule."
      evidence_strength: strong
    - id: "F-{006}.016"
      what: "The review of the common-module fixes found four medium defects in the first fix pass: an absurd Retry-After date raised OverflowError out of the parse; the extra= redaction covered one code path only, broke unpickling of a record and rested on interpreter internals; the write wrapper would commit or roll back a transaction the caller already held, and lost all-or-none on an autocommit connection; several secret shapes were still missed."
      how: "Static review; the fix builder reports each seen red before the fix."
      why: "All four are changed: any parse failure falls back to the growing wait and a non-finite cap is refused; extra= fields are redacted by a wrap of Logger.makeRecord, with uninstall_redaction() to remove it; the write wrapper issues its own BEGIN IMMEDIATE and raises when the connection is already in a transaction; the name rule and the value rule in log.py are rewritten."
      evidence_strength: strong
    - id: "F-{006}.017"
      what: "The main thread's own brief caused a step toward failing open. It told the builder that 'clientKeyValue=' is not a secret name; to honour that the builder narrowed the rule to 'the last word of the name is a key word', and secret_key_base=, password_hash= and api_key_id= then kept their values."
      how: "Named by the builder in its report as a weakness; read by the main thread; corrected in a third pass and probed directly in the main thread (each of the three now redacted, monkey=1 and /bottles unchanged)."
      why: "The rule as built now: a name is a secret name when any of its words is key, token, secret, password, passwd or pwd, or ends in token, secret, password, passwd or pwd. Over-redaction is the accepted side and is pinned as such in a test (token_count, clientKeyValue, primary key: id). This also restores one-word names such as sessiontoken, given up at F-{006}.012."
      evidence_strength: confirmed
    - id: "F-{006}.018"
      what: "The adapter and fetch code held up under review: all eight fix claims hold. The defects were in the tests and the test double. One contract test asserted, for the Moneybird adapter, that a payment makes the invoice paid — a value only the double supplies. The double invented a 401, a 400, a 404 and an empty list without labelling them."
      how: "Static review against API-NOTES.md."
      why: "A 404 on a read now has no meaning of its own (RuntimeError, like any unexpected status); the unknown-invoice test is per adapter; the paid-state assertion runs on the fake only; the double's seven assumptions are in one titled section of its docstring, each with the tests that depend on it."
      evidence_strength: strong
    - id: "F-{006}.019"
      what: "A test module left log redaction installed for the tests that ran after it: test_fetch.py, through fetch's moneybird path."
      how: "Reproduced by the correction builder: a test at the start of test_log.py asserting stock logging failed when test_fetch.py ran first; it passes with an autouse cleanup in test_fetch.py."
      why: "A third candidate for the 74/73/74 flake of F-{006}.011, and like the other two not shown to be its cause."
      evidence_strength: confirmed
  also_changed:
    - "A read that exhausts its retries raises a plain RuntimeError naming the httpx error class; nothing reachable from it carries the request (this closes the fourth 'left weak' line above)."
    - "A fake-adapter run no longer loads settings from the environment beyond the database path (this closes the sixth 'left weak' line above)."
    - "insert_pending and insert_pending_many read their rows back inside the transaction; a row that cannot be read back raises."
  still_open_after_round_two:
    - "No review and no break-and-watch run after THIS round. The 93 tests added in it and the main-thread projector changes have had no second reader."
    - "Two adapter tests (the 401 message; the catch of any httpx error on the booking call) were never seen red."
    - "A KeyboardInterrupt is tested during the insert, not during the commit or the rollback."
    - "Redaction: an unquoted value stops at a quote character inside it (password=ab\"cd keeps cd); a URL password containing an unescaped @ or / is not fully covered; extra= values that are not strings are not redacted; logging.makeLogRecord and attributes set on a record after creation are not covered."
    - "The check that no request is reachable from a raised error is a walk over attributes, not exhaustive."
    - "Everything under 'owed' above that names the Mollie key, the questions at the end of API-NOTES.md, the README section, the public test record and the operator's items."

