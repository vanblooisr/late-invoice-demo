# REPORT: late-invoice-demo — stage 1 built and checked; why the text renderer refused the build plan
# Session 006, 2026-11-21. Purpose: one record of (1) why render_text refused BUILDPLAN files, (2) what
# was built for P1 step 1 and how it was checked, (3) what the checks left open, including the tests
# that are owed and not written. Findings, not conclusions: what to do with each is the operator's call.

frame:
  project: late-invoice-demo
  nnn: 006
  date: "2026-11-21"
  mode: "centrifugal (CONTRACT_annie_v2); build work on the operator's words 'lets solve the final open threads, than proceed to building straight away'"
  question: "Why does the renderer refuse the plan; what does stage 1 do now; what do its tests hold and not hold?"
  boundary: |
    Interpreter: Python 3.14.6. Environment: repo/.venv in this worktree, installed from requirements.lock
    (pip freeze equal to the lock), plus detect-secrets 1.5.0 and its three dependencies, which the
    session-004 environment also carried and the lock does not list.
    Suite counts in this report are from runs made in the main thread unless a line says an agent ran it.
    Reviews are static reads by separate reviewer instances; they ran nothing.
    Break-and-watch runs were made by agents on scratch copies; the main thread did not re-run them.
    NOT covered: stages 2 to 5 and common/mollie.py (still stubs); any run against Moneybird, Mollie or
    Telegram (no keys exist); the first upload and the history scan in the public clone.

# ------------------------------------------------------------------------------------------------
# PART 1 — the renderer refusal
# ------------------------------------------------------------------------------------------------

renderer_refusal:
  tool: "Working/TOOLS/renderers/text/render_text.py"
  symptom: "exit 3, 'boundary rejection: expected a single document in the stream'"
  findings:
    - id: "F-{006}.001"
      what: "The renderer loads a .yaml file with yaml.safe_load (line 639), which accepts exactly one YAML document. A file with '---' separators between sections is several documents; the parser raises and the CLI reports it as a boundary rejection."
      how: "Read of render_text.py _cli(); the refusal reproduced on the plan with --toc."
      why: "The refusal is about document count, not file size: the 4,280-line graphic-design-annie plan renders, the 469-line late-invoice-demo plan did not."
      evidence_strength: confirmed
    - id: "F-{006}.002"
      what: "Of 31 BUILDPLAN files under Working/Projects, 8 are refused. Seven for the multi-document reason: late-invoice-demo, session-procedures v1, finance-trading-development v1, annie-foundation v5, graphic-program-annie v1 (in topos/), agentic-workflow-development core-stations v1 and v2. The eighth, agentic-workflow-development v3.1, fails with a YAML syntax error inside the file ('while parsing a block mapping')."
      how: "Each of the 31 files run through render_text --toc in this worktree; exit codes and first error line recorded."
      why: "The eighth is a different defect and a renderer change for multi-document files would not fix it."
      evidence_strength: confirmed
    - id: "F-{006}.003"
      what: "The separators carry no information for a reader that parses the file. In this plan each '---' sat directly above a '# === SECTION ===' comment banner that already marks the section."
      how: "Read of the plan; the four separators were at lines 9, 22, 138 and 377."
      why: "Answers the operator's question whether the separators are of use to the model: they are not."
      evidence_strength: confirmed
    - id: "F-{006}.004"
      what: "Why plans were written with separators is not established. plan-standard's own SKILL.md uses '---' between its blocks, which a plan born from it could copy."
      how: "grep of the SKILL.md for '^---'; no trace of the plan's authoring was read."
      why: "Named as an inference so it is not carried forward as a cause."
      evidence_strength: circumstantial
    - id: "F-{006}.005"
      what: "gen_render_text_vocab.py, in the same folder as the renderer, already reads multi-document files with yaml.safe_load_all."
      how: "grep, line 96."
      why: "A renderer change has a precedent beside it. The one rule such a change needs: what to do when the same top-level key appears in two documents of one file."
      evidence_strength: confirmed
  rulings:
    - {id: "D-{006}.001", decision: "The renderer is to be changed (fix the tool, not the files), in a session of its own; it is not edited in this session", operator_words: "i would like to go for a small change in the renderer itself. fix the tool, not the file in this case. or have the separators no use for you? log it in the report. were NOT editing it here.", status: provisional}
    - {id: "D-{006}.002", decision: "Of the affected plans only this project's build plan is edited here; the other files are the operator's, in their own sessions", operator_words: "on the --- in yaml files: we only edit this buildplan. the rest, ill take care of it in appropriate sessions.", status: provisional}
  done_here:
    - "BUILDPLAN_late-invoice-demo_v1.yaml: the separators at lines 22, 138 and 377 removed (3 lines deleted, nothing else changed in that edit). The file is one document; render_text --toc lists 14 sections."
    - "repo/tools/project_public_plan.py changed, because it dropped the governance section by POSITION (the fourth document). On a one-document plan the old code would have classed the whole plan as governance. It now drops decision_ledger, decision_trail and version_history by NAME, keeps only the top-level sections named in PUBLIC_TOP_KEYS, and refuses to write when it meets a top-level key it does not know."
    - "Checked by running: on the four-document plan the new projector's output was byte-identical to the public copy in the repo; on the one-document plan the content was the same; a plan with an invented top-level section was refused with nothing written."
  not_done:
    - "render_text.py is unchanged."
    - "The other seven plans are unchanged."
    - "The projector change has had no second reader."

