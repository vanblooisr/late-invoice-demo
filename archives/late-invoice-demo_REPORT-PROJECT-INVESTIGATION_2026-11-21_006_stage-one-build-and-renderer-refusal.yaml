findings:
  - id: "F-{006}.006"
    what: "The amendment review found four tests that could not fail against a wrong implementation: 'booking is never retried' (its double raised an error the retry policy never retries); the open-amount comparison (every test created the link for the open amount, so comparing with the link's amount passed); four demo tests that called demo.run with no seams and no network guard; the one-statement compare-and-set (a read-then-write version passed)."
    how: "Static review by an opus reviewer; each claim was re-read by the fix builder before it changed a test."
    why: "All four were rewritten in the fix pass. The rewritten tests are red until their stages are built, so none of the four has been seen to catch the wrong implementation yet."
    evidence_strength: strong
  - id: "F-{006}.007"
    what: "One existing test was wrong: 'a Mollie key with a leading space in the .env file is refused'. python-dotenv strips the space from an unquoted value before the loader sees it."
    how: "The fix builder ran dotenv_values on such a file and reported the stripped value; the main thread did not re-run it."
    why: "The case was rewritten with a quoted value. The earlier test would have stayed red for a reason unrelated to the rule it named."
    evidence_strength: strong
  - id: "F-{006}.008"
    what: "The stage-1 reviews found defects in code written this session, each against a rule already ruled: a failed db write left its transaction open; set_link accepted an empty link; log fields passed through extra= skipped redaction; a badly formatted log line raised inside the caller; redaction missed several secret shapes and mangled ordinary text ('/bottles', 'monkey='); an HTTP-date Retry-After was ignored; UnsupportedProtocol and LocalProtocolError were retried; an over-long amount string raised ValueError where MoneyError is promised; caller-supplied invoice ids reached a URL without a digits check; fetch committed a batch row by row."
    how: "Two static reviews; the fix builders report each of these seen red before the fix."
    why: "All are fixed. The fixes have had no review after them."
    evidence_strength: strong
  - id: "F-{006}.009"
    what: "MoneybirdAdapter.get_contact had been written against a contacts endpoint and an email field that API-NOTES.md does not cover, and the test double had been extended to match, so the test checked the code against itself. The same pattern held for a 422 reply the double invented."
    how: "Static review, confirmed against API-NOTES.md sections (b), (f), (h) by the reviewer."
    why: "get_contact now raises UnsupportedVerb and the contacts route and the 422 reply are out of the double. Both questions are listed in API-NOTES.md as open."
    evidence_strength: strong
  - id: "F-{006}.010"
    what: "Break-and-watch on stage 1: of 115 breaks, 73 were caught. Per module, caught of applied: money 9/10 · retry 11/13 · db 19/20 · config 5/10 · log 9/13 · fake adapter 5/12 · Moneybird adapter 10/25 · fetch 5/12. Three survivors were labelled as unable to change behaviour."
    how: "One sonnet agent on a scratch copy, whole suite per break, passed-set compared with the baseline; its report. Not re-run."
    why: "The 39 real survivors each became a test in the fix passes. Many of those tests were green on first run: the code already kept the rule and nothing pinned it. No break-and-watch run has been made AFTER the fix passes, so the 335 tests added since the 478 baseline are not shown to fail."
    evidence_strength: strong
  - id: "F-{006}.011"
    what: "A flaky test was reported once and not found. During the first break-and-watch run three extra baseline runs gave 74, 73 and 74 passed. After the fix pass the builder ran the suite 15 times and under 25 hash seeds with one result; the main thread ran it three times at 460, three times at 813, each identical."
    how: "Agent reports and main-thread runs."
    why: "Two candidates were changed in the same period and either could have been the cause: four demo tests that could reach outside the test, and a log-test fixture that left redaction installed for later tests. Which one, or neither, is not shown."
    evidence_strength: observed
  - id: "F-{006}.012"
    what: "The pre-upload tree check refused the new code on 8 lines, none of them a secret: five lines of a dict literal in config.py mapping a field name to its variable name (the rule is case-insensitive and read 'moneybird_token\": \"MONEYBIRD_TOKEN' as a filled assignment); the word 'session' inside log.py's key-name pattern; a comment banner in a test ('the token' followed by a run of dashes); an ISO date in a docstring example."
    how: "tools/check_public_tree.py run from the project folder; the flagged lines read."
    why: "Each was resolved by changing the flagged line, not the checker: the dict is built from the field names; 'session' is out of the pattern; the banner and the docstring are reworded. The cost of the second: 'sessionkey' and 'sessiontoken' written as one word are no longer redacted by name ('session_token' still is, through 'token'). The checker's over-broad matches are unchanged."
    evidence_strength: confirmed
  - id: "F-{006}.013"
    what: "Running detect-secrets with --baseline rewrote .secrets.baseline: a new generated_at timestamp and one added filter entry. No new result entry."
    how: "git diff of the file after the scan."
    why: "The file differs from the committed one without a reason the operator asked for."
    evidence_strength: confirmed

# ------------------------------------------------------------------------------------------------
# PART 3 — owed, not done
