owed:
  tests_not_written:
    - what: "Link expiry. The status link_expired and the edge link_created -> link_expired are tested in test_db. No test exists for DETECTING an expired link, and nothing in the code produces that edge."
      blocked_on: "The rule is not decided (D-{006}.008). Three things are missing: what counts as expired (expiresAt passed and unpaid, or something the response states); a clock seam on check_payments; where the expiry check sits relative to the paid-elsewhere check."
      note: "The first amendment builder reported that API-NOTES.md does not state how an ended link shows on the wire. The reviewer found that expiresAt is documented and the Mollie double already takes an expiry, so the wire shape is not the only blocker."
    - what: "A break-and-watch run on the tests added by the two fix passes."
    - what: "A review of the two fix passes and of the projector change."
  questions_the_notes_do_not_answer:
    where: "repo/API-NOTES.md, last section, 'Open before the first live run — not read yet'"
    items:
      - "Whether Moneybird's list endpoints paginate. The adapter reads one reply and would not notice a cut-off list."
      - "The contacts endpoint, its fields and its token scope."
      - "What 404 and 422 mean on the sales-invoice endpoints."
      - "Which timezone defines payment_date (the adapter sends the UTC calendar date)."
      - "Whether the 201 reply's price or date can differ from what was sent."
    also_open_and_not_in_that_list: "Whether a company contact's firstname and lastname can be null; the adapter raises on null."
  left_weak_by_the_builders_own_account:
    - "Redaction of extra= fields relies on how CPython's logging writes them onto the record; the tests pin the behaviour, not the mechanism."
    - "extra= values that are not strings (a dict of headers) are not redacted."
    - "The bearer rule is a heuristic: a long all-letter word after 'bearer' is mangled; an all-letter token shorter than 8 characters is not redacted."
    - "A read that exhausts its retries raises the raw httpx error, whose request object carries the Authorization header. str() and repr() of it do not contain the token. Only the POST path was changed."
    - "DEFAULT_FIXTURES_PATH points from package code into core/tests/fixtures; an install without the tests folder has no default data. Stated in the docstring, not changed."
    - "A bad MOLLIE_TEST_KEY in the process environment fails a fake-adapter run."
  operator_side:
    - "DONE after this report was first written: the operator typed the elevation and the line TELEGRAM_USER_ID= was added to the env example file (six variables, matching the README); the tree check's filled-assignment rule gained that name."
    - "OT-004: a Mollie test key; the first response also gives the rate limit the poll interval needs."
    - "OT-007: the history scan in the public clone and the tree check on the uploaded tree, at the first upload."
    - ".secrets.baseline: keep the rewritten file or restore the committed one."

