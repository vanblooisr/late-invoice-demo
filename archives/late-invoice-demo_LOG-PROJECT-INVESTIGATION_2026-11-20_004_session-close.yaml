findings:
- id: F-{004}.01
  what: F-{004}.01 Mollie's payment-link object carries no paid-amount field, only paidAt; the amount comes from GET /payment-links/{id}/payments
    — the writeback guard needs a second request (verified against raw page bytes).
  how: model at-landing
- id: F-{004}.02
  what: F-{004}.02 Moneybird scopes apply to personal tokens (checkboxes at creation); financial_account_id is optional on
    create-payment (required only for private_payment/cash_payment); the register_payment PATCH is deprecated with a sunset
    date; filter=state:late alone drops the default period filter.
  how: model at-landing
- id: F-{004}.03
  what: 'F-{004}.03 Mollie idempotency keys live one hour and a reused key with a different body answers 400: the link expiry
    must derive from the row''s created_at so a retried body is byte-identical, and the stored link id is the durable guard.'
  how: model at-landing
reasoning: 'The build ran as parallel seats under one orchestrator. Step 4: four sonnet gatherers read the vendor pages through
  the fetch tool; the orchestrator then fetched every cited page raw with curl and checked each quoted phrase against the
  bytes (all found; the three expected absences confirmed), and pulled the one table the fetch tool had truncated from the
  page''s embedded OpenAPI JSON. Step 6: two sonnet builders wrote the modules that needed no vendor field names while step
  4 ran, a third wrote the Mollie and writeback modules after API-NOTES landed; the zero-point run was classified per test
  from the junit report, not counted by eye. The review went out as 26 opus cells in two waves (the concurrency cap is 20);
  each fragment was written to disk and mapped onto the run''s record contract by script, then ingested — 266 findings, 118
  signals, 26 coverage rows, every planned cell with records. Scoring was a band by severity (every finding carried a quoted
  line, so specificity did not separate them); the gate is PASS (no critical), the verdict FLAG (13 highs). The fix round:
  three sonnet fixers by test slice with deduplicated item lists, the orchestrator on the skeleton contracts, the tools and
  the documents; an opus verifier then re-read the 13 highs and 72 mediums against disk and ran the suite, and a second round
  closed what it named except the demo stage''s injection seam, deferred to OT-011.6. Default rule for findings the operator
  had not seen: a test, tool or contract defect is fixed; a question the plan itself contradicts (backoff, open vs total amount,
  days-late data, booking order) is recorded as OT-011 with the conservative reading left in the code, never decided here.
  Verification witnessed in the transcript, not in a filed source: the curl quote checks and the backspace-byte grep after
  the Edit-tool incident; in the ledger''s check rows: the pytest runs between rounds; filed: the zero-point log, the run''s
  cells, the envelope with the verifier''s report.'
self_assessment: 'Held: nothing built past signatures and docstrings, with two one-line exceptions the zero-point log lists
  as green for that reason (MollieClient''s repr and its test_-key check in the constructor); every vendor claim checked against
  raw page bytes before it entered API-NOTES, with ''not stated'' written where the pages are silent (Wero on the test checkout,
  the per-administration token limit, Moneybird''s decimal format); the zero-point log lists every green test with its reason
  and the one red test whose reason is not a stub; the plan read back after the patch (four documents, step statuses, eleven
  threads, 48 ledger rows, v4) and the public copy regenerated clean under both tools. Reached past and caught: the Edit tool
  turned a backslash-b into a backspace byte in the projector''s regex and the projection silently stopped matching — caught
  by probing the pattern''s bytes, fixed through a script file, the tree swept for 0x08; my own banned-word list then flagged
  genuine plan prose (''a recorded decision'') and my own done_on_disk text that listed the banned words — both found by the
  projector refusing, both corrected rather than exempted. Not held on first pass: the first zero-point log classified the
  retry assertion case as a stub failure (the verifier caught it; the classifier now reads the assertion); the long-run secret
  rule fired on every long test name (the tree checker''s own output showed it; the rule in tools/public_vocabulary.py now
  requires letters and digits); and the projector''s first article-absorbing rules left ''the a later weekday'' and future
  dates reading as past — found by the provenance review cell and by the verifier''s regression probe, not by the tools. Unverified:
  the full-history secret scan (no history exists before the first upload; the command is named in the config); detect-secrets''
  behaviour was probed on three files, not a commit. Not done: the README rewrite through the journalism skill (amended only
  — a ruling); the ledger-quote grep step 5 asks for; the demo stage''s injection seams (OT-011.6); the two .gitkeep placeholders
  still deletion-blocked. The counters fold ran on the operator''s word in the same message as the close order.'
tensions: 'T1 ''every test red'' (P0 step 6) vs 30 green tests that pin contracts the skeleton already declares (constants,
  reprs, the Protocol check, the command line with stand-in bodies): kept green and listed with reasons, the wording handed
  to the operator as OT-011.7 — making them red would have meant deleting declared contracts. T2 ''control and fix again whats
  been found'' (D-{004}.03) vs findings that are design questions: 266 findings; every high and medium that is a test, tool
  or contract defect fixed, lows where they were one-line defects, two highs partial (test_demo''s Mollie seam deferred with
  OT-011.6); eleven questions where the plan contradicts itself, is silent, or words a thing differently from the code (backoff
  vs none, open vs total amount, days-late data, booking order and the crash window, group-chat tapping user, demo seams,
  parked statuses, the retry boundary around register_payment) recorded, not decided. T3 Review depth vs cost: 26 opus cells
  on a red suite produced 266 findings, most of the form ''a wrong implementation would pass this test'' — real yield, and
  the verifier after the fixers found further items its regression probe lists in the envelope; the cost per line was high
  again, as in 003. T4 A public tree inside an estate whose vocabulary leaks: the first run of the tree checker found 94 workspace
  words in the public plan and two in the README (the run''s output, transcript-witnessed); the fix was a shared word list,
  article-absorbing rewrites and a refusal guard, and even then my own plan prose tripped the projector''s refusal twice (transcript-witnessed)
  — the refusals were the review, not an obstacle. T5 Tests before code vs signatures that did not exist: the plan says the
  baseline is written against ''the function signatures that step 1''s skeleton declares'', but step 1 declared no Mollie
  client, no callback parsing, and for the stages only run / add_arguments / main, no stage-level function a test could call;
  the skeleton was widened at step 6 with signatures only, named in done_on_disk, so the tests have a fixed target without
  a body being written.'
sparks: 'S1 The Edit tool turns a backslash-b in its arguments into a backspace byte (0x08); regex-bearing edits go through
  a script written with the Write tool, and a byte grep for 0x08 belongs after any Edit of a pattern — an aw-lane lesson.
  S2 The subagent concurrency cap is 20; a grid above it dispatches in waves and the dispatcher needs to know the cap. S3
  The cached parallel-reviewer agent still lacks the Skill tool the worktree source has (cache unsynced since 003); cells
  read the spec by path again. S4 WebFetch truncates long vendor pages and the truncation is silent: curl the raw page and
  search it; the Moneybird create-payment table lived in the page''s embedded OpenAPI JSON. S5 A word-rewriting projector
  needs article-absorbing rules, date rewrites that carry their preposition, and a residue guard; the banned-word scan alone
  passes mangled grammar. S6 A verifier pass after the fixers found ten items the fixers'' own reports had not — the pattern
  from 003 held and belongs as the default tail of every fix dispatch. S7 The hook''s decision-candidate scraper still landed
  59 rows this session (35 in 003) whose text matches the task brief and subagent hand-backs, although a scribe gate for hand-backs
  was added after the 003 close (commit d3cd437d); why the gate did not stop them is not established — inference, for the
  aw lane.'
