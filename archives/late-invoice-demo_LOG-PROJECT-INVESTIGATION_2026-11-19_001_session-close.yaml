reasoning: 'Brainstorm ran in discipline mode: ground (one document), purpose (AskUserQuestion, one per
  turn), three routes with costs, the ladder recommended and chosen. The viability question split into
  three (buildable / wanted / interesting) and only the first was answerable from the document; the market
  half was named unsourced and left to Monday''s conversation rather than filled. Plan-session walked
  entry → design (two shapes) → sectioned approval (P0+P1 grouped, P2 alone, compression named) → handoff
  (OUTER close, build in a later session with subagents). The one structural tension — annie''s one-contract
  rule vs cascade — was settled by reading the cascade contract (M8: primary read before contradicting),
  which defines itself as a slice inside the annie session. The category moved from Business-judiciary
  to Projects at the render because the close machinery files under Archives/Projects/ and the work is
  a build; the first proposal is kept on record in the BUILDPLAN.'
self_assessment: 'Held: one question per turn throughout; every operator answer landed in the BUILDPLAN
  ledger with the operator''s words at the moment it landed (21 rows); forward-risk lines beside every
  step (13); no code written, no conclusions drawn for the operator on ''interesting''. Owned: (1) the
  ledger rows were written into the plan but NOT through scribe-append as they landed, so the first render
  refused on scrape-majority (21 doc-scrape vs 3 conversation) and the sweep re-landed them — the Layer-2
  channel was owed per decision, not at close; (2) the folder was renamed before asking whether the operator
  wanted it, and the operator later referred to business/ — the rename stood under D-{001}.11 but should
  have been named at the time; (3) Business-judiciary was proposed as category without checking the filing
  machinery, found at render; (4) the learning-vs-delegation disagreement was said once and not pressed
  — correct under SG-08, noted so the next session does not treat delegation as unexamined.'
tensions: 'T1 Learning-first (D-{001}.03) vs subagents write the code (D-{001}.15): reading and running
  code teaches less than writing it; operator kept the delegation, on record. T2 Portfolio public from
  the first commit (D-{001}.19/.20, MIT) vs the side-income framing (D-{001}.04): MIT lets anyone resell
  the code; the business, if any, is the per-client service — named, not resolved. T3 Three-phase plan
  approved today vs Monday''s audience answer (OT-002): rung 4''s write target and rungs 1 and 3''s read
  target may move (all three touch Moneybird); only rung 2 is package-independent. T4 Partial checker
  (BoT evidence_base): validate-pad-digest.js reports a missing PLAYBOOK for digest-only projects and
  exits 0 — the same on agentic-workflow-development; a green run there certifies less than its name says.'
sparks: 'S1 validate-pad-digest.js digest-only branch (wrench-row candidate): read registry_scratchpads.pad_type
  before looking for a PLAYBOOK. S2 plan-standard extension candidate (OT-006): forward_risks on steps
  as a schema field, since forward-look says the risk sits beside the step. S3 The identity record is
  minted from the operator''s first words (''NEW PROJECT, session 001'' → project new-project) and needs
  a REDECLARE once the slug exists — a first-close checklist line for the close card. S4 Build-session
  brief shape: one driving session, one subagent per rung through brainstorm-gate → plan-code-build →
  builder + reviewer/qa; operator-only steps (keys, sandbox data, GitHub upload) listed up front so the
  session does not wait on them silently.'
