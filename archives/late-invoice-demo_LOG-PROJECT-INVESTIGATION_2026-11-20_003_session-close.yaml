findings:
- id: F-{003}.01
  what: 'F-{003}.01 Review-run cell ids containing a colon (axis:slice) are written as NTFS alternate data streams on Windows:
    zero-byte files named after the axis, records silently lost; renamed to axis--slice and re-ingested. review_run.py cmd_plan
    mints DC-nnn ids and does not hit this; hand-made grids do.'
  how: model at-landing
- id: F-{003}.02
  what: F-{003}.02 parallel-reviewer agents have no Skill tool, so 'load code-review-spec at turn 1' cannot execute; all 18
    cells fell back to the agent definition or a raw read of SKILL.md (several read the main-checkout copy, not the worktree).
    The dispatch card assumes a load path the agent does not have.
  how: model at-landing
- id: F-{003}.03
  what: 'F-{003}.03 Hooks block the builder seats from reading .env.example (secret-path guard) and from deleting files: config.py
    needed the variable names supplied from the plan text; two redundant .gitkeep placeholders (common/, tests/) remain on
    disk.'
  how: model at-landing
reasoning: 'The build ran as two seats and a verifier chain: a sonnet seat wrote the skeleton, a haiku seat froze the lock
  file in a fresh venv and proved the pins install on a second one; the orchestrator re-ran every claimed check itself (install,
  lid, python -m, pytest, isinstance against the port, grep for banned words) before anything was called done. The review
  was the /code-review card run as written: 18 cells (six axes x common / adapters / stages+cli) on opus, nofilter, fail_level
  error; 81 raw findings, no critical or high. Scoring kept 73 (default 85 — the envelope''s default_rule; 12 overrides: 8
  dropped below 80 each with its reason, 4 surviving overrides each with a confidence_note — plan-named class names, demo-scale
  paging, a wall-clock finding dissolved by defining late as the vendor''s state). One sonnet fix round applied the 67 findings
  marked fixed (6 deferred with reason); an independent opus verifier then confirmed 10 of 13 fix items, found 3 partial and
  9 new — the -OO crash, a regex looser than its grammar, one exception with two meanings, an all-or-nothing Settings that
  contradicted ''fake needs no keys'' — and a second round closed all 9. The provenance pass was the census (an id/tense grep
  over the package — zero hits; transcript-witnessed, not filed) plus the three provenance cells'' cold-read, which found
  15 findings the grep cannot see. Plan-conflicting findings were resolved on the plan''s side and the plan''s architecture
  text amended to what the code declares, recorded as v3. Two tooling defects surfaced in the pipeline itself and are filed
  as findings, not fixed.'
self_assessment: 'Held: nothing built past the skeleton; every builder claim re-run by the orchestrator before acceptance;
  the review grid confirmed by the operator''s standing word, every cell''s coverage recorded including what it could not
  reach; scoring overrides written down, not applied silently; plan read back after every edit for structure (44 ledger rows,
  v3, step complete, parses as four documents) — not for content: the cop found two lines the second fix round had made stale
  (get_contact''s exception, the python -m exit-line claim), amended at the cop. Reached past and caught: the first ingest
  wrote 18 cells into six zero-byte files — the colon in my hand-made cell ids became an NTFS alternate data stream — and
  I counted zero findings before noticing; renamed and re-ingested, 81 recovered. The reviewers could not load the spec (no
  Skill tool) and every cell said so; I did not re-dispatch, I recorded it. Not held: the ''same stderr line on both paths''
  claim I sent to the fixer was overstated (the verifier caught it — the body matches, the prefix is the invoker''s); and
  one ''operator'' slipped into a public docstring from my own brief. Transcript-witnessed, not in a named file: the venv
  checks, the -OO run, the regex probe. Unverified: the lock pins under a real 3.11 interpreter (wheels only). Not done: the
  public projection in repo/working/ is stale (OT-007, step 5); two .gitkeep placeholders remain because deletion is hook-blocked
  for the model; the counters fold waits for the operator''s word.'
tensions: 'T1 ''Fix any and all problems found'' vs findings that are design decisions (currency column, list paging, as_of,
  a Secret type): resolved on the plan''s side or by documenting the assumption: the currency column, list paging and the
  wall-clock finding were DROPPED below the 80 cut with their reasons (design at demo scale, dissolved by the vendor-state
  definition of late), the Secret type is the one of these recorded as deferred; six findings are deferred in total, each
  with its reason — the operator''s instruction was read as ''fix what is a defect'', not ''widen the design''. T2 Learning-first
  (D-{001}.03) vs subagents write the code (D-{001}.15) persists; the skeleton gives the operator a readable contract to review
  before any behaviour exists, which is the narrowing the zero-point baseline was meant to give. T3 Review depth vs skeleton
  size: 18 opus cells on 14 KB of stubs produced 81 findings, most of them undeclared contracts rather than bugs — the yield
  was real but the cost per line was high; the plan''s step 6 tests will be the cheaper reviewer from here. T4 A public repo
  written inside an estate whose vocabulary leaks: ''not built yet'' entered the code and was caught by the provenance reviewers''
  cold-read (the mechanical census greps ids and history tense, not build-state wording); ''operator'' entered a docstring
  from the orchestrator''s own fix brief and was caught by the orchestrator''s banned-word grep — transcript-witnessed, not
  in a filed source.'
sparks: S1 review_run.py ingest should reject or map ':' in cell ids — one line, removes a silent-loss class on Windows. S2
  parallel-reviewer needs the Skill tool or the dispatcher must inline the spec's axis text into each cell prompt; today 'load
  the spec at turn 1' is a dead instruction in the card. S3 The UserPromptSubmit ruling-tell hook scrapes subagent hand-backs
  as operator prompts (35 false candidates this session); a channel check would end that. S4 The verifier-after-fixer pattern
  (independent opus read of the fix list) found 9 defects the fixer's own checks passed — worth making the default tail of
  every fix dispatch. S5 A banned-word grep for estate vocabulary (operator, subagent, session, yet) belongs in the P0 step
  5 hygiene floor beside the secret scanner.
