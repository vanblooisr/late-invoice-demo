  products — the other fifteen library KBs were not opened. The operator''s stated purpose was to go over
  the plan before building — problems, knowledge, security, the adapter question — so the session''s object
  was the gap between the plan as approved and the plan as buildable, and the gap between what the estate
  holds and what this build needs. No slice was declared; every plan and bulletin edit followed an operator
  ruling of the same turn (the mechanical consequences — figure re-renders, a package docstring — followed
  from the rename ruling), and the three questions the operator asked (the payment wait, double payment,
  floats) were answered before anything was changed.'
