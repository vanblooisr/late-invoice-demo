reasoning: 'Review ran as findings first: plan-vs-disk drift (cli.py missing behind a declared entry point),
  the public projection carrying 24 operator quotes, a build that could not start without operator keys,
  loop ownership decided one phase late, and a security list led by the double-payment guard (money integrity
  before booking) — the order was the author''s judgment, not a measured ranking. The adapter question
  resolved into the estate''s own ports-and-adapters pattern sized to four verbs, which also dissolved
  the keys blocker (a Fake adapter) and reframed the audience thread from blocker to adapter selector.
  Each ruling became plan edits with a ledger entry quoting the operator (D-{002}.06 bundles seven edits
  under five joined quotes); the public projection became a generated artifact with a banned-word check
  so the privacy fix cannot regress silently. The bulletin followed the plan: v2 content, figures re-rendered
  from specs, then two operator-driven passes — plain words (the provenance-strip walk, applied to a public
  artifact) and condensation (19 plates at the start, 20 after the D-3 split, 15 at the end, D-3 honoured
  by dropping dividers and a table rather than squeezing). The operator''s own three rule families replaced
  the ''engineering rules'' plate after they said the session''s decisions were not rules.'
self_assessment: 'Held: findings before edits; every structural claim about the plan, the KB or the figures
  checked on disk before it was stated (M8); the figure embed transform verified byte-exact on an unchanged
  figure before being applied; every bulletin change checked by four validators and an in-browser floor/overflow
  pass, repeated after each fix. Reached past and caught: the first ''ten rules on one plate'' layout
  overflowed by a third and the first hygiene-node placement overlapped stage 3 — both found by the mechanical
  checks, not by eye; the plate 5 note added at condensation pushed the figure plate over and was moved.
  Process claims this record carries without a cop source (witnessed in the transcript and the hook stderr,
  not in a named file: the four validators, the in-browser floor/overflow pass, the byte-exact embed check,
  the overflow figures, the ''faulty headliners'' exchange, and the order in which questions were answered):
  the scrape-majority refusal (16 vs 0) overridden on the record because every scraped decision was authored
  this session from the operator''s words of the same turn; the projection script and the embed/strip
  scripts live in the session scratchpad, not the repo — named as OT-007 and spark S1, not fixed. The
  ''faulty headliners'' remark took two exchanges to resolve; the first reading was wrong and said so.'
tensions: 'T1 Learning-first (D-{001}.03) vs delegation (D-{001}.15) persists; the zero-point test baseline
  (D-{002}.12) gives the operator a reading surface before any code exists — in this author''s reading
  that narrows it; it does not resolve it. T2 Build in public vs operator privacy: the plan standard''s
  at-landing ledger is designed for the estate and was copied byte-for-byte into a public folder; addressed
  by a generated projection with a banned-word check — whose first version still leaked one quote through
  the plan''s meta entry note (caught by the close cop, VF-04, fixed before filing); the rule lives in
  a scratchpad script until P0 step 5 (e) lands it in the repo. T3 Density vs plate count: D-3 split one
  overflowing plate into two, then the operator ruled condensation; fewer, plainer plates won over more,
  fuller ones, and the house''s own law (dividers once per chapter) yielded to the subject. T4 Jargon
  in a public artifact: the bulletin inherited a chassis whose comments cite house rules sixty times and
  even described another bulletin''s subject; stripping it changed zero rendered pixels, which is the
  provenance-strip definition of success and also the measure of how much noise rode along unseen.'
sparks: 'S1 project_public_plan.py belongs in the repo as a tool run at P0 step 5 (e) and at every close;
  today it is a scratchpad script. S2 The provenance-strip walk held unchanged on a public artifact (jargon,
  house ids, inherited chassis comments) — a station candidate for every artifact that leaves the estate.
  S3 The in-browser floor/overflow check is run by hand each time; validate-template-conformance prints
  the JS but does not run it — a headless runner would make D-4/D-5 mechanical. S4 The figure embed transform
  (host letter-spacing tokens, ink-faint lift) is a renderer flag waiting to exist. S5 plan-standard:
  main_rules and kb_refs as schema fields — the operator''s three families are a plan-level layer every
  build plan could carry.'
