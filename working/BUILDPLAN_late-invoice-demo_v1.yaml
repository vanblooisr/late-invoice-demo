      + fixtures/ · requirements.lock (16 exact pins from pip freeze on 3.14 — PyYAML added for tools/ in an earlier
      build round; wheels verified for 3.11) · pyproject version dynamic from __version__. Checked: compileall clean;
      every module imports; `lid` installs and runs; both adapters pass isinstance(BookkeepingPort); pytest collects
