- name: P0 — Setup
  status: in-progress
  build_steps:
  - step: 1
    name: Code folder born secrets-safe
    status: complete
    what: 'Build step: create the repository folder (layout, a ruling: core/late_invoice_demo/ = ONE installable
      package — pyproject.toml at the root, package-dir core, one module per stage (fetch · approve · link · writeback
      · demo) + common/ (db · config · money · ports) + adapters/ (moneybird · fake) + cli.py exposing the console
      command `lid` with subcommands fetch · approve · link · check · demo; each stage also runs as python -m late_invoice_demo.<stage>;
      tests under core/tests/ · working/ = the PROJECTED BUILDPLAN (system_model.public_projection) + the bulletin''s
      public copy · archives/ = logs and reports, one per build round, never edited after) with, before any code,
      LICENSE (MIT, a ruling) + .gitignore (.env, *.db, __pycache__/, .venv/) + .env.example (MONEYBIRD_TOKEN, MONEYBIRD_ADMINISTRATION_ID,
      MOLLIE_TEST_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, all empty) + README + exact-pinned dependencies (httpx,
      python-telegram-bot, python-dotenv) in a lock file, Python 3.14. No nested .git inside this plan''s home folder.
      Owner: create the public GitHub repo under the personal account (done, a ruling) and upload the folder''s
      contents only after step 5 passes.'
    done_on_disk: 'Verified (an earlier build round): LICENSE · .gitignore · .env.example (five empty variables)
      · README.md · pyproject.toml · core/late_invoice_demo/__init__.py · working/ (plan + bulletin, unprojected)
      · archives/.gitkeep. Public repo created and empty. Verified (an earlier build round): the SKELETON — signatures,
