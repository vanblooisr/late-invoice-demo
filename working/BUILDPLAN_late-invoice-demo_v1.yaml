  - step: 3
    name: Test data in the sandbox
    status: pending
    what: 'By hand: 4–5 contacts with obviously fake names (e.g. ''Bakkerij Voorbeeld'', ''Testklant De Vries'');
      5–8 sent sales invoices with varied amounts; at least 3 with a due date in the past so they stand on `late`;
      1 already paid, to show it is skipped.'
    depends_on: step 2
    produces: Sandbox showing late invoices.
    verification: NONE
    forward_risks:
    - commitment: invoice state `late` as the filter key
      collision_type: binding_dependency
      collides_with: P1 step 1 filter=state:late
      condition: the sandbox does not transition sent invoices to `late` automatically on a past due date; if so,
        the fetch returns nothing and the stage looks broken when the data is.
  - step: 4
    name: Resolve the API unknowns from the docs
    status: complete
    what: 'Read, do not assume: (a) which Mollie payment-link field signals paid, and what the paid AMOUNT field
      is called (docs.mollie.com, Payment Links → Get payment link); (b) whether Moneybird''s create-payment needs
      financial_account_id (developer.moneybird.com, Sales invoices → Create a payment); (c) Moneybird throttling
      limits (developer.moneybird.com, Throttling); (d) whether Wero shows on the Mollie test pay page; (e) whether
      Mollie accepts an Idempotency-Key header on payment-link creation, so a timed-out POST can be retried without
      a second link; (f) whether a Moneybird personal token can be scoped to one administration or to read-only
      (step 2); (g) whether a Mollie payment link can be deactivated or archived after creation (needed by P2 step
      1''s double-payment guard). Write the answers with URLs and the read date into API-NOTES.md in the repo.'
    done_on_disk: 'Verified (an earlier build round): repo/API-NOTES.md — eight sections (a)-(g) plus (h) sales-invoice
      fields, each with Source URLs, its own Read date, answers with ''not stated'' and inferred marked inline,
      and a Depends-on line. Read through a fetch tool and verified against the raw page bytes (curl + phrase search;
      the create-payment parameter table came from the page''s embedded OpenAPI schema, which the fetch tool had
      truncated). Answers: (a) paidAt is the only paid signal, the paid AMOUNT is not on the link object and comes
      from GET /payment-links/{id}/payments; amounts are {currency, value} strings, two decimals by example only;
      (b) create-payment is POST .../sales_invoices/{id}/payments.json with {payment: {payment_date, price}} required
      and financial_account_id OPTIONAL (needed only for private_payment / cash_payment actions), 201; register_payment
      PATCH is deprecated (with a sunset date); (c) 150 requests per 5 minutes per IP, 429 + Retry-After and RateLimit-*
      headers; (d) Wero on the test checkout is NOT STATED on either page — inferred, to be confirmed with a test
      key; (e) Idempotency-Key accepted on all POSTs, cached 1 hour, 400 on a reused key with a different body,
      409 while in flight, Idempotent-Replayed header; (f) scopes DO apply to personal tokens (checkboxes at creation;
      sales_invoices is the one needed), no read-only variant, per-administration limit not stated; (g) archive
      via PATCH {archived: true}; DELETE only before the link is opened or paid (422 after). Design consequences
      recorded in the notes: writeback needs the payments sub-resource for the amount check; the key covers the
      one-hour retry window and the stored link id is the durable guard; expiry must be fixed per action so a retried
      body is identical.'
    remaining: 'Nothing for the seven questions. Open from the read: the decimal format of Moneybird''s amount strings
      is not stated (examples show one decimal) — the adapter parses strictly and fails closed, so a one-decimal
      sandbox reply surfaces on the first live run (recorded in (h)). Q-004 stays open until a test link is opened
      with a test key.'
    depends_on: —
    produces: API-NOTES.md with seven sourced answers; Q-003 closed, Q-004 re-stated.
    verification: REVIEW
    forward_risks:
    - commitment: field names and required parameters for P1 step 3 and P2 step 1
      collision_type: binding_dependency
      collides_with: P1 step 3 (Mollie create) and P2 step 1 (Mollie read + Moneybird write)
