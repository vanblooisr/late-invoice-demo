# PLAN: late-invoice-demo — public copy of the build plan
# Generated by tools/project_public_plan.py from the plan's source copy, which is kept outside this repository; the governance section, decision references, dates, quoted words and words about how the plan was made are removed. Do not edit here: the next generation overwrites this file.
# Purpose: Build a demo of one idea — a late invoice triggers a Telegram message, the owner taps Goedkeuren, the debtor gets a Mollie payment link, and after payment the invoice is marked paid in Moneybird — as a ladder of five small, independently runnable programs.
---
purpose_and_design_goals:
  purpose: 'Build a demo of one idea — a late invoice triggers a Telegram message, the owner

    taps Goedkeuren, the debtor gets a Mollie payment link, and after payment the invoice is

    marked paid in Moneybird — as a ladder of five small, independently runnable programs.

    Each stage is a runnable program on its own; the composed demo falls out at the end.

    '
  the_demo_in_four_steps:
  - A late invoice is visible in Moneybird (script fetches invoices with state `late`).
  - 'A Telegram message arrives: invoice number, amount, days late, buttons Goedkeuren / Afwijzen.'
  - 'After Goedkeuren: a Mollie payment link in test mode, opened and ''paid'' in the browser.'
  - The invoice shows as paid in Moneybird and Telegram reports Betaald — the step that turns a payment link into
    a solution.
  design_goals:
  - Each stage runs and demonstrates something on its own.
  - 'Secrets never enter the repo: .gitignore before code, .env.example committed, test keys only.'
  - 'Idempotent state: one row per invoice, a payment never booked twice (unique key on invoice_id; before the booking
    the row is claimed link_created → booking by one compare-and-set, and only the claiming run books — a ruling).'
  - 'Fake data only: no real names, emails or amounts of existing companies. Real-data use is a separate, later
    decision with its own list.'
  - 'Scope rule: anything not in the in-scope list below is out of the demo, however tempting mid-build.'
  - 'Fail closed: on any API error, timeout, or status value the code does not recognise, the row stays as it was
    and the run says so. No step guesses a state.'
  - 'Retry policy: a failed connection is retried 3 times with a growing wait between attempts, and a 429 waits
    the time its Retry-After header names unless that time is above the cap of 60 seconds, in which case the error
    is raised at once, then the step cancels and reports ''connection failed after 3 attempts''. The policy lives
    in one place (common/) so it can be widened later without touching the stages.'
  - 'Logging rule: log lines carry who, what, when and the row id — never a token, a bearer header, or a URL that
    contains a key.'
  - 'Money is never a float: amounts are stored as integer cents or Decimal and formatted once, in common/money.py,
    for both Mollie and Moneybird.'
  - 'Ports and adapters: every stage talks to the bookkeeping system through one small interface (the BookkeepingPort);
    Moneybird is the first adapter, a Fake adapter serves the tests, a second real package can follow without touching
    the stages.'
  - 'Security and safety are a gate, not a feature: before a step is built it names what can leak (keys, invoice
    data), what can go wrong with money (a double booking, a wrong amount, a stale link) and who can trigger what
    (a tap from a foreign chat, a replayed callback) — and names the guard for each. A step without its threat line
    does not start.'
  - 'Tests before code: the baseline suite is written before stage 1 and committed as the zero point, red wherever
    a body is missing; a test that is green there is proven once by breaking the contract it pins. Each build step
    turns its own slice green, never deletes a red test to get there, and gets the same break-and-watch step as
    it turns green; the build ends with every test green.'
  main_rules:
  - family: Safety and security
    why: The demo touches money and a customer list. A wrong booking is a real correction; a leaked key is a real
      breach. Nothing moves unless it is safe to move, and when in doubt it does not move.
    holds: secrets never in the repo · a payment booked once · fail closed · money as integer cents · the double-payment
      guard · token scope · callback checks · the hygiene floor before upload · the security gate per step
  - family: Transparency and traceability
    why: A reader, a review, or the owner in a month must be able to see what happened and why, from the record
      alone — in the code, in the logs, in the repo, in the plan.
    holds: one log line per step with who, what, when and the row id · the forward-only state machine (history is
      readable from the row) · API-NOTES.md with URLs and read dates · the plan projected into the repo · the zero-point
      test baseline · the written record per build round in archives/
  - family: Efficiency and design
    why: Small parts that run alone, one way to do each thing, nothing built that the demo does not need. The cost
      of a change should be proportional to the change.
    holds: each stage runs on its own · one port with four verbs, adapters behind it · one money formatter · one
      retry policy in one place · one module per stage, one package, one command · the scope rule · fake data only
  in_scope:
  - One Moneybird sandbox administration with 5–8 invented invoices.
  - Fetching late invoices.
  - A Telegram message with Goedkeuren / Afwijzen.
  - Creating a Mollie payment link in test mode.
  - Checking whether the link is paid.
  - Booking the payment back into Moneybird.
  - One log line per step (who, what, when) in a local file or SQLite.
system_model:
  code_home: 'Written in this plan''s home folder at the repository folder. Public GitHub repository: https://github.com/vanblooisr/late-invoice-demo.git;
    the owner uploads from that folder, this plan''s home folder never pushes it.'
  runtime: 'One Python 3.14 process on the owner''s laptop; httpx; python-telegram-bot v21+; python-dotenv; SQLite
    (one file). Dependencies are pinned to exact versions in a lock file so a fresh install a month later runs the
    same code. No hosting, no scheduler: the script is started by hand during the demo.'
  architecture: "Ports and adapters (hexagonal), sized to the demo and no larger. The stages never\nimport a vendor\
    \ client directly. One port, four verbs:\n  BookkeepingPort (Protocol, in common/ports.py):\n    list_late_invoices()\
    \ -> list[Invoice]\n    get_invoice(invoice_id) -> Invoice\n    register_payment(invoice_id, amount_cents, paid_at)\
    \ -> PaymentReceipt\n    (optional by convention) get_contact(contact_id) -> Contact — listed in the Protocol\
    \ so\n    the signature is fixed; an adapter that does not support it raises UnsupportedVerb\n    (distinct\
    \ from StageNotBuilt, which means the body is not written).\n  Invoice / PaymentReceipt / Contact are plain\
    \ frozen dataclasses with amounts as integer\n  cents and UTC-aware datetimes — never the vendor's JSON. \"\
    Late\" means the invoice state the\n  bookkeeping system itself reports (state:late), not a due-date computed\
    \ here; the Fake\n  adapter reads that state from its fixtures.\n  common/ also carries entry.py (exit codes\
    \ 2 usage / 3 not-built, the StageNotBuilt stub\n  exception, one guarded runner used by `lid` and by every\
    \ python -m path) and retry.py (the\n  one retry policy, 3 attempts); log.py is the one redaction function plus\
    \ install_redaction,\n  which attaches the filter to the ROOT handler so third-party loggers (httpx, telegram)\
    \ are\n  covered. The --db flag (every stage) resolves flag → Settings.db_path → DEFAULT_DB_PATH in\n  config.resolve_db_path,\
    \ one place. The actions table is EUR-only (no currency column).\nAdapters, in order of arrival:\n  1. MoneybirdAdapter\
    \ (adapters/moneybird.py) — the first real target.\n  2. FakeBookkeeping (adapters/fake.py) — in-memory, loaded\
    \ from JSON fixtures; makes every\n     stage testable before any key exists and keeps the tests fast and offline.\n\
    \  3. A second real package only if one is ever needed; the port may need a\n     field or two widened then\
    \ — that is the honest per-package cost, together with the\n     semantic differences (what 'late' means, how\
    \ a payment is registered, token vs OAuth,\n     rate limits, multi-administration).\nStage 2 (Telegram) never\
    \ touches the port. Stages 1 and 3 read through it, stage 4 writes\nthrough it. The payment side (Mollie) stays\
    \ a direct client for now; a PaymentPort is the\nsame move if a second payment provider ever appears.\nScope\
    \ trap, named: the port is four verbs. The moment it grows into 'a bookkeeping\nabstraction' the work becomes\
    \ the headache this pattern is meant to avoid.\n"
  public_projection: 'The public repo''s working/ folder carries a PROJECTION of this plan, generated, never copied:
    the GOVERNANCE section (decision_ledger, decision_trail) is dropped entirely,

    owner quotes do not appear anywhere, and no dates or persons are named. The bulletin''s public copy follows
    the same rule. this plan''s home folder copy

    stays the source of truth; the projection is re-generated at each close.

    '
scope_boundaries:
  not_covered:
  - Dashboard (Moneybird and Telegram are the screen); login, users, roles (one user); multi-tenant, RLS, Supabase;
    OAuth (a personal API token suffices for one administration); webhooks (Mollie cannot reach localhost — the
    demo pulls the status itself); scheduler; real e-mail to debtors; SEPA or other bookkeeping packages; legal
    documents (no real personal data).
  - Demo -> first client (KvK registration, verwerkersovereenkomst, EU hosting, webhooks, incasso law check) — pruned
    from scope.
  - Recording the 2-minute video and a one-pager — pruned, pull back when the demo runs.
  - A GitHub organization or second account — owner declined for now.
