  - step: 2
    name: Accounts and keys
    status: pending
    what: 'Moneybird: user account + sandbox administration (moneybird.com/administrations/sandboxes/new) + personal
      API token (moneybird.com/user/applications/new); record the administration id. Token scope: a personal token
      reaches every administration the user can see, so the code addresses exactly one administration id from .env
      and never lists or picks administrations; if Moneybird offers a sandbox-only or read-scoped token, take it
      and note it in API-NOTES.md (verify at step 4). Mollie: account, test API key (test_...) — test keys cannot
      move real money. Telegram: bot via @BotFather, own chat id. All three land in the local .env only. Sandbox
      invoices carry a Moneybird watermark; name it if asked.'
    depends_on: step 1
    produces: Filled local .env (never committed); administration id known; token scope recorded.
    verification: NONE
    forward_risks:
