      collision_type: downstream_misalignment
      collides_with: the recorded demo (pruned)
      condition: a viewer asks; name it, do not hide it.
  - step: 2
    name: Stage 5 — composition and three clean runs
    status: pending
    what: One entrypoint (`lid demo`) runs the four functions in order with a log line per step (who, what, when,
      row id) into SQLite, inside the bot's loop (owner decided at P1 step 2). The manual browser payment sits between
      stage 3 and stage 4; the demo waits for it by polling. demo.run takes injected seams for Telegram, Mollie
      and the wait, so the composition is tested without a network. Walk the done-checklist below; run the full
