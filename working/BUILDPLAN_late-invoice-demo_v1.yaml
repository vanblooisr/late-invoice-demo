- name: P2 — Write side and composition (stages 4–5)
  status: pending
  build_steps:
  - step: 1
    name: Stage 4 — controleer_betaling() + Moneybird write-back
    status: pending
    what: 'Poll the payment link from Mollie: the pace is read from Mollie''s RateLimit headers, the wait gives
      up after 5 minutes, Ctrl-C stops it, and on timeout or cancel the row stays `link_created` for a later `lid
      check`. If paid (field per API-NOTES.md): the DOUBLE-PAYMENT GUARD before any booking — (1) re-fetch the invoice
      through the port and check it is still unpaid; (2) compare the paid amount Mollie reports with the invoice''s
      open amount, cents to cents; (3) only if both hold, register the payment through the port — once, never retried,
      since the call is not idempotent — (Moneybird: POST .../sales_invoices/{id}/payments.json with payment_date
      and price, and financial_account_id if API-NOTES.md says so); (4) the row is CLAIMED before the booking: status
      link_created → booking as one compare-and-set UPDATE (WHERE status=''link_created''), so two interleaved runs
      cannot both book; only the run that made the claim registers the payment, then booking → paid. A row found
      in `booking` at the start of a run means an earlier run stopped mid-booking: it moves to the terminal `booking_unconfirmed`,
      is reported, and is never booked again by the program. A paid amount that differs from the open amount moves
      the row to the terminal `amount_mismatch`; a link that ran out unpaid moves it to the terminal `link_expired`;
      an approved row whose invoice is already paid before a link exists moves to `paid_elsewhere`. If the invoice
      was paid another way in the meantime, do NOT book: set status to `paid_elsewhere`, report ''customer paid
      twice — refund needed'' in Telegram and the log, and (if P0 step 4 (g) allows) deactivate the link. An amount
      mismatch is reported and left unbooked (fail closed). Prevention at the source: stage 3 already refuses a
      link for a paid invoice, links expire in ~14 days, and the Telegram message names the invoice so the owner
      sees a stale link. Confirm Betaald in Telegram. Runs standalone; README section.'
    depends_on: P1 step 3; P0 step 4 (a, b, g)
    produces: Stage 4 program; invoice shows paid in Moneybird; a paid-elsewhere case is reported, never booked.
    verification: TDD
    requirements:
    - 'failing test first: running the check twice books the payment once'
    - 'failing test first: a row not in link_created is never booked'
    - 'failing test first: an invoice already paid in the (Fake) bookkeeping is not booked again and is reported
      as paid_elsewhere'
    - 'failing test first: a paid amount that differs from the invoice amount is not booked and is reported'
    forward_risks:
