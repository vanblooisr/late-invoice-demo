- id: Q-011
  topic: 'Rulings an earlier review surfaced, each with a conservative reading in the code and tests until ruled:
    (1) retry backoff — design goal says ''short backoff'', retry.py says none; retry(sleep=) is the hook, tests
    pin that it is called between attempts only. (2) writeback compares the paid amount with Invoice.amount_cents;
    the spec''s ''what'' says open amount — a partly paid invoice tells them apart; Invoice has no open-amount field.
    (3) ''days late'' in the Telegram message has no data source (ActionRow has no due date; stage 2 never touches
    the port) — add due_date to the row or drop the field. (4) booking order — register_payment then compare-and-set,
    as the spec says; the two steps are not one transaction, a crash between them reads as paid-elsewhere on the
    next run; a claim status before booking would close it. (5) handle_callback gates on chat id only; a group chat
    would need the tapping user''s id too. (6) demo.run has no injection seam for Telegram, Mollie or the payment
    wait, so test_demo pins only run()''s outer contract. (7) ''every test red'' vs 30 green tests that pin declared
    contracts — re-word step 6 or make them red. (8) step 5 requirement wordings — RULED in an earlier build round:
    the narrowing to key shapes is confirmed; the ledger-quote check is closed by the hand run. (9) idempotency
    key = ''<invoice id>-<row id>'' (survives a database reset); link expiry derived from the row''s created_at
    + 14 days so a retried body is byte-identical. (10) parked outcomes with no status edge — an approved row whose
    invoice turns out paid, a link_created row with an amount mismatch, an expired link — stay where they are and
    are re-read and re-reported every run; a terminal status for each (or a ''parked once'' rule) is a design choice.
    (11) register_payment is excluded from the retry policy (not idempotent) — the reads are retried, the write
    is not; confirm.'
  status: done
