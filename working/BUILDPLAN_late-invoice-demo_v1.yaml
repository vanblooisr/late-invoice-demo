    depends_on: P2 step 1; Q-008 decided
    produces: Runnable demo; done-checklist ticked except the video item (pruned).
    verification: REVIEW
    requirements:
    - three consecutive clean runs, logged
    - secret scan of the full history clean (the scanner from P0 step 5, re-run here)
    done_checklist:
